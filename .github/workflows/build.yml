
name: Build Bomberman 64 3DSX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker and installer
        run: |
          docker --version
          docker info
          test -f instalar.sh
          chmod +x instalar.sh

      - name: Prepare ROM
        env:
          BM64_ROM_URL: ${{ secrets.BM64_ROM_URL }}
        run: |
          set -eu

          if [ -z "$BM64_ROM_URL" ]; then
            echo "Secret BM64_ROM_URL belum diatur."
            exit 1
          fi

          curl --fail --silent --show-error --location \
            "$BM64_ROM_URL" \
            --output "$RUNNER_TEMP/bm64.z64"

          test -s "$RUNNER_TEMP/bm64.z64"
          ls -lh "$RUNNER_TEMP/bm64.z64"

      - name: Build Executable Homebrew
        run: |
          set -eu
          ./instalar.sh "$RUNNER_TEMP/bm64.z64"
          test -f salida/SD/3ds/bm64.3dsx
          echo "Build berhasil."

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman64-3DS-Files
          path: salida/SD/
          if-no-files-found: error
          retention-days: 1
          
