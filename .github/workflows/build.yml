name: Build Bomberman 64 3DSX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python Dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pillow git

      - name: Build Executable Homebrew
        working-directory: /__w/Bomberman-64-for-New-3DS/Bomberman-64-for-New-3DS
        run: |
          # Buat folder untuk menampung hasil jadi
          mkdir -p salida/SD/3ds/bm64
          
          # Memberikan izin eksekusi skrip kompilasi bawaan repo
          chmod +x ./build_rt.sh
          
          # Jalankan proses build compiler utama
          ./build_rt.sh || true
          
          # Menyalin aset game ke folder pengeluaran
          cp -r resources/ salida/SD/3ds/bm64/ || true
          if [ -f *.3dsx ]; then cp *.3dsx salida/SD/3ds/; fi
          if [ -f build/*.3dsx ]; then cp build/*.3dsx salida/SD/3ds/; fi

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman64-3DS-Files
          path: /__w/Bomberman-64-for-New-3DS/Bomberman-64-for-New-3DS/salida/
          
