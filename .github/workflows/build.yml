name: Build Bomberman 64 3DSX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates perl make wget gnupg python3 python3-pillow

      - name: Install devkitPro tools
        run: |
          # Unduh dan pasang pengelola paket devkitPro resmi untuk Ubuntu
          wget https://github.com
          sudo apt-get install -y ./devkitpro-pacman.amd64.deb
          
          # Sinkronisasi dan pasang kompiler khusus Nintendo 3DS (3ds-dev)
          sudo dkp-pacman -Syy --noconfirm
          sudo dkp-pacman -S 3ds-dev --noconfirm

      - name: Build Executable Homebrew
        run: |
          # Atur variabel lingkungan compiler agar terbaca oleh sistem
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          # Buat struktur folder luaran
          mkdir -p salida/SD/3ds/bm64
          
          # Berikan izin akses eksekusi dan jalankan kompilasi otomatis bawaan repo
          chmod +x build_rt.sh
          ./build_rt.sh || true
          
          # Menyusun komponen aset ke dalam folder paket zip
          cp -r resources/ salida/SD/3ds/bm64/ || true
          if [ -f *.3dsx ]; then cp *.3dsx salida/SD/3ds/; fi
          if [ -f build/*.3dsx ]; then cp build/*.3dsx salida/SD/3ds/; fi

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman64-3DS-Files
          path: salida/
          if-no-files-found: warn
          
