name: Build Bomberman 64 3DSX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python Dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pillow git

      - name: Build Executable Homebrew
        run: |
          # Trik Otomatis: Cari folder tempat file build_rt.sh berada dan masuk ke sana
          TARGET_DIR=$(find / -name "build_rt.sh" -path "*/Bomberman-64-for-New-3DS*" -print -quit 2>/dev/null | xargs dirname)
          if [ -n "$TARGET_DIR" ]; then
            echo "Folder proyek ditemukan di: $TARGET_DIR"
            cd "$TARGET_DIR"
          else
            echo "Mencoba folder kerja saat ini..."
          fi
          
          # Buat folder untuk menampung hasil jadi
          mkdir -p salida/SD/3ds/bm64
          
          # Berikan izin akses eksekusi dan jalankan kompilasi
          chmod +x ./build_rt.sh
          ./build_rt.sh || true
          
          # Menyalin aset game ke folder pengeluaran
          cp -r resources/ salida/SD/3ds/bm64/ || true
          if [ -f *.3dsx ]; then cp *.3dsx salida/SD/3ds/; fi
          if [ -f build/*.3dsx ]; then cp build/*.3dsx salida/SD/3ds/; fi
          
          # Pindahkan folder salida ke tempat yang aman agar bisa di-upload
          mv salida /tmp/salida_output

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman64-3DS-Files
          path: /tmp/salida_output/
          
