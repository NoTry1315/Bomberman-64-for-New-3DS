
      - name: Inspect project files
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Root files ==="
          ls -la

          echo "=== Build scripts ==="
          find . -maxdepth 3 -type f \
            \( -name 'Makefile' \
            -o -name 'makefile' \
            -o -name 'Dockerfile' \
            -o -name '*.sh' \) \
            -not -path './.git/*'
            
