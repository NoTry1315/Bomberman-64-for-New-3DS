name: Build Bomberman 64 3DSX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y p7zip-full build-essential cmake ninja-build clang lld python3 python3-pillow git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Executable Homebrew
        run: |
          # Masuk ke folder kerja proyek menggunakan variabel lingkungan resmi
          cd "$GITHUB_WORKSPACE"
          
          mkdir -p salida/SD/3ds/bm64
          
          # Mengatur hak akses eksekusi script penata build secara lokal
          chmod +x build_rt.sh
          
          # Jalankan kompilasi utama menggunakan compiler internal devkitARM
          ./build_rt.sh || true
          
          # Menyusun hasil aset ke folder keluaran
          cp -r resources/ salida/SD/3ds/bm64/ || true
          if [ -f *.3dsx ]; then cp *.3dsx salida/SD/3ds/; fi
          if [ -f build/*.3dsx ]; then cp build/*.3dsx salida/SD/3ds/; fi

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman64-3DS-Files
          path: ${{ github.workspace }}/salida/
          
