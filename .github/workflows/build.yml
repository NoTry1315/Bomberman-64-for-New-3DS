name: Build Bomberman 64 3DSX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python Dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pillow git

      - name: Build Executable Homebrew
        run: |
          # Paksa sistem masuk ke direktori utama repositori di GitHub Actions
          cd /github/workspace
          
          # Buat struktur folder luaran hasil jadi
          mkdir -p salida/SD/3ds/bm64
          
          # Cek file mana yang tersedia di dalam repositori dan berikan izin eksekusi
          if [ -f ./build_3ds.sh ]; then
            chmod +x ./build_3ds.sh
            ./build_3ds.sh || true
          elif [ -f ./build_rt.sh ]; then
            chmod +x ./build_rt.sh
            ./build_rt.sh || true
          else
            echo "Menjalankan kompilasi langsung via Make..."
            make || true
          fi
          
          # Menyalin seluruh aset lingkungan game ke folder pengeluaran
          cp -r resources/ salida/SD/3ds/bm64/ || true
          if [ -f *.3dsx ]; then cp *.3dsx salida/SD/3ds/; fi
          if [ -f build/*.3dsx ]; then cp build/*.3dsx salida/SD/3ds/; fi

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman64-3DS-Files
          path: /github/workspace/salida/
          
