name: Build Bomberman 64 3DSX

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates perl make wget gnupg python3 python3-pillow

      - name: Install devkitPro Toolchain
        run: |
          sudo mkdir -p /usr/local/share/keyrings
          wget -O- https://devkitpro.org | sudo tee /usr/local/share/keyrings/devkitpro-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/local/share/keyrings/devkitpro-keyring.gpg] https://devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends 3ds-dev

      - name: Build Executable Homebrew
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          
          # 1. Jalankan kompilasi utama menggunakan Makefile resmi proyek
          make TARGET=3DS -j$(nproc)
          
          # 2. Buat struktur folder pengeluaran (salida) secara bertahap langsung di root
          mkdir -p salida/SD/3ds/bm64
          
          # 3. Salin folder resources bawaan jika ada
          if [ -d resources ]; then
            cp -r resources/* salida/SD/3ds/bm64/
          fi
          
          # 4. Ambil langsung file .3dsx dari folder utama tanpa pencarian rumit
          cp *.3dsx salida/SD/3ds/

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman64-3DS-Files
          path: salida/
          if-no-files-found: error
          retention-days: 30
          
