name: Build Bomberman 64 3DSX

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python Dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pillow git

      - name: Build Executable Homebrew
        run: |
          # 1. Pindah secara mutlak ke folder proyek utama di dalam Docker
          cd "$GITHUB_WORKSPACE"
          
          # 2. Jalankan kompilasi menggunakan Makefile resmi proyek
          make TARGET=3DS -j$(nproc)
          
          # 3. Buat struktur folder pengeluaran (salida) langsung di root proyek
          mkdir -p salida/SD/3ds/bm64
          
          # 4. Salin folder resources bawaan jika ada
          if [ -d resources ]; then
            cp -r resources/* salida/SD/3ds/bm64/
          fi
          
          # 5. Ambil langsung file .3dsx dari folder utama tanpa pencarian rumit
          cp *.3dsx salida/SD/3ds/

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman64-3DS-Files
          path: ${{ github.workspace }}/salida/
          if-no-files-found: error
          retention-days: 30
          
